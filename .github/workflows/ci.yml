name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=$(pwd) pytest

  frontend-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test -- --run
      - run: npm run build

# Version 1.4.2 note:
# The previous Docker Compose smoke job is intentionally not active because
# the current local-desktop branch no longer has an active root full-stack
# docker-compose.yml. Docker/PostgreSQL/nginx are not ordinary R3 Windows
# desktop requirements. Reintroduce Compose CI only if R3 explicitly restores
# Docker/server deployment and updates active compose files, docs, tests,
# validation evidence, and release instructions together.
