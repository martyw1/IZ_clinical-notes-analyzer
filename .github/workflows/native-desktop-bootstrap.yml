name: Native desktop bootstrap

on:
  push:
    branches:
      - "codex-native/**"

permissions:
  contents: read

jobs:
  native-contract:
    if: ${{ endsWith(github.ref, '/trigger') }}
    name: contract-${{ matrix.target_os }}-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: windows
            architecture: x64
            runner: windows-2022
            python_architecture: x64
          - target_os: macos
            architecture: arm64
            runner: macos-15
            python_architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out trigger
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install exact Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
          architecture: ${{ matrix.python_architecture }}
          cache: pip
          cache-dependency-path: backend/requirements-windows-local.txt

      - name: Validate bounded request
        id: request
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          request_path="$RUNNER_TEMP/iz-native-bootstrap-request.json"
          cp .ci/native-bootstrap-request.json "$request_path"
          workflow_blob="$(git rev-parse "HEAD:.github/workflows/native-desktop-bootstrap.yml")"
          python scripts/ci/write-native-bootstrap-receipt.py request \
            --request "$request_path" \
            --repository "$REPOSITORY" \
            --repository-id "$REPOSITORY_ID" \
            --repository-node-id "R_kgDOReY3VA" \
            --remote origin \
            --trigger-ref "$TRIGGER_REF" \
            --workflow-blob-sha "$workflow_blob" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check out exact target
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 1
          clean: true

      - name: Install locked application and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r backend/requirements-windows-local.txt pytest==9.0.3

      - name: Run hardcoded native mode
        shell: bash
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python scripts/ci/write-native-bootstrap-receipt.py run \
            --request "$RUNNER_TEMP/iz-native-bootstrap-request.json" \
            --trigger-sha "${{ github.sha }}" \
            --target-os "${{ matrix.target_os }}" \
            --runner-label "${{ matrix.runner }}" \
            --receipt native-receipt.json

      - name: Upload bounded receipt
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: native-bootstrap-${{ matrix.target_os }}
          path: |
            native-receipt.json
            native-junit.xml
          if-no-files-found: error
          retention-days: 7

      - name: Download receipt by exact artifact name
        if: success()
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: native-bootstrap-${{ matrix.target_os }}
          path: native-roundtrip

      - name: Verify artifact round trip
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git diff --no-index --exit-code native-receipt.json native-roundtrip/native-receipt.json
          git diff --no-index --exit-code native-junit.xml native-roundtrip/native-junit.xml
